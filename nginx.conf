# İstanbul Trafik — Nginx sunucu bloğu
#
# Docker imajında /etc/nginx/conf.d/default.conf olarak kullanılır.
# Ubuntu'da /etc/nginx/sites-available/istanbul-trafik olarak kopyalanabilir
# (bkz. DEPLOYMENT.md). TLS bu blokta sonlandırılmaz; HTTPS için certbot ile
# eklenen 443 bloğunu veya önünüzdeki ters proxy'yi kullanın.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Sağlık kontrolü (Docker HEALTHCHECK ve izleme için)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite'ın hash'li çıktıları: içerik değişince adları da değişir → uzun süreli önbellek
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML her zaman yeniden doğrulanır; yeni sürüm anında yayılır
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gizli dosyaları sunma
    location ~ /\. {
        deny all;
    }
}
